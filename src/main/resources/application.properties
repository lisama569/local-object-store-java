# 数据与元数据落盘根目录
objectstore.root-dir=data/object-store
# 每个调用方（owner）的字节配额
objectstore.quota-bytes=67108864
# 单个分片允许的最大字节数
objectstore.max-part-size=8388608
# 最大分片数量（也是声明分片总数 expectedParts 的上限）
objectstore.max-parts=10000
# 上传会话滑动有效期（毫秒）：任何会话交互按此时长顺延 expiresAt
objectstore.upload-ttl-millis=86400000
# 未完成上传连续空闲过期阈值（毫秒）：超过该时长无任何交互即过期并回收容量；<=0 关闭过期
objectstore.upload-idle-ttl-millis=86400000
