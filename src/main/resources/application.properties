# 本地对象存储配置（测试可通过临时目录覆盖）
# 数据根目录：blobs/(内容寻址) uploads/(在途分片) meta/(JSON 元数据) tmp/(一次性写入临时区)
objectstore.root-dir=${OBJECTSTORE_HOME:data/objectstore}
# 全仓逻辑容量（字节）：唯一 blob + 在途分片占用之和
objectstore.capacity-bytes=${OBJECTSTORE_CAPACITY:104857600}
# 单个分片默认上限（字节）
objectstore.default-max-part-size=${OBJECTSTORE_MAX_PART:8388608}
# 单次上传分片数上限
objectstore.max-parts-per-upload=${OBJECTSTORE_MAX_PARTS:1000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# 字节上传接口直接读原始 InputStream；关闭表单内容过滤器，
# 避免 curl --data-binary 默认的 form 类型请求体被预消费
spring.mvc.formcontent.filter.enabled=false
